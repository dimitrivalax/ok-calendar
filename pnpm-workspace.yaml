nodeLinker: hoisted

allowBuilds:
  unrs-resolver: true

minimumReleaseAgeExclude:
  - lucide-react-native@1.46.0
  - expo-calendar@58.0.7
  - expo-dev-client@58.0.20
  - expo-dev-launcher@58.0.20
  - expo-sqlite@58.0.17
  - expo@58.0.25

# Pin lightningcss: >=1.30.2 breaks react-native-css / NativeWind
# (deserialize Specifier error). See parcel-bundler/lightningcss#1081
overrides:
  lightningcss: 1.30.1
